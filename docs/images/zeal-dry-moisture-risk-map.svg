<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" role="img" aria-labelledby="t d">
 <title id="t">ZEAL-Dry moisture risk map</title>
 <desc id="d">Room temperature against relative humidity, showing the Preferred/Maximum/Critical relative-humidity bands, the fixed 12/15/17 degree dew-point risk thresholds, and the condensation-risk band where dew-point spread is 3 degrees or less.</desc>

 <rect width="900" height="570" fill="#f7f7f7"/>
 <text x="32" y="34" font-family="Arial" font-size="21" font-weight="700" fill="#202124">ZEAL-Dry — moisture risk map</text>
 <text x="32" y="54" font-family="Arial" font-size="13" fill="#5f6368">Room temperature vs. relative humidity, with dew point and condensation-spread risk</text>

 <rect x="24" y="70" width="852" height="460" rx="9" fill="#fff" stroke="#d6d6d6"/>

 <g transform="translate(0,78)">
  <!-- RH risk-band background fills (defaults: preferred 60% / maximum 65% / critical 75%) -->
  <rect x="140" y="30" width="720" height="142.9" fill="#fbe4e1"/>            <!-- critical  RH>=75 -->
  <rect x="140" y="172.9" width="720" height="57.1" fill="#fdecd2"/>          <!-- high      65<=RH<75 -->
  <rect x="140" y="230.0" width="720" height="28.6" fill="#fdf6da"/>         <!-- elevated  60<=RH<65 -->
  <rect x="140" y="258.6" width="720" height="171.4" fill="#eaf3ea"/>        <!-- preferred RH<60 -->

  <!-- gridlines -->
  <g stroke="#e5e7eb">
   <path d="M140 30V430M320 30V430M500 30V430M680 30V430M860 30V430"/>
   <path d="M140 30H860M140 87.1H860M140 144.3H860M140 201.4H860M140 258.6H860M140 315.7H860M140 372.9H860M140 430H860"/>
  </g>
  <rect x="140" y="30" width="720" height="400" fill="none" stroke="#c7c7c7"/>

  <!-- condensation-risk band: dew-point spread <= 3 degC (default safety_margin_c) -->
  <path d="M 140.0,135.0 L 158.0,134.6 L 176.0,134.2 L 194.0,133.9 L 212.0,133.5 L 230.0,133.1 L 248.0,132.8 L 266.0,132.4 L 284.0,132.0 L 302.0,131.7 L 320.0,131.3 L 338.0,131.0 L 356.0,130.6 L 374.0,130.2 L 392.0,129.9 L 410.0,129.5 L 428.0,129.2 L 446.0,128.9 L 464.0,128.5 L 482.0,128.2 L 500.0,127.8 L 518.0,127.5 L 536.0,127.1 L 554.0,126.8 L 572.0,126.5 L 590.0,126.1 L 608.0,125.8 L 626.0,125.5 L 644.0,125.2 L 662.0,124.8 L 680.0,124.5 L 698.0,124.2 L 716.0,123.9 L 734.0,123.5 L 752.0,123.2 L 770.0,122.9 L 788.0,122.6 L 806.0,122.3 L 824.0,122.0 L 842.0,121.7 L 860.0,121.4 L 860.0,30.0 L 140.0,30.0 Z"
        fill="#8e24aa" opacity="0.14"/>
  <path d="M 140.0,135.0 L 158.0,134.6 L 176.0,134.2 L 194.0,133.9 L 212.0,133.5 L 230.0,133.1 L 248.0,132.8 L 266.0,132.4 L 284.0,132.0 L 302.0,131.7 L 320.0,131.3 L 338.0,131.0 L 356.0,130.6 L 374.0,130.2 L 392.0,129.9 L 410.0,129.5 L 428.0,129.2 L 446.0,128.9 L 464.0,128.5 L 482.0,128.2 L 500.0,127.8 L 518.0,127.5 L 536.0,127.1 L 554.0,126.8 L 572.0,126.5 L 590.0,126.1 L 608.0,125.8 L 626.0,125.5 L 644.0,125.2 L 662.0,124.8 L 680.0,124.5 L 698.0,124.2 L 716.0,123.9 L 734.0,123.5 L 752.0,123.2 L 770.0,122.9 L 788.0,122.6 L 806.0,122.3 L 824.0,122.0 L 842.0,121.7 L 860.0,121.4"
        fill="none" stroke="#8e24aa" stroke-width="2.25" stroke-dasharray="1 5" stroke-linecap="round"/>

  <!-- dew-point isolines: fixed code thresholds in 0.2.0 (12 / 15 / 17 degC) -->
  <path d="M 212.0,30.0 L 230.0,48.5 L 248.0,66.3 L 266.0,83.4 L 284.0,100.0 L 302.0,115.9 L 320.0,131.3 L 338.0,146.2 L 356.0,160.5 L 374.0,174.3 L 392.0,187.6 L 410.0,200.5 L 428.0,212.9 L 446.0,224.9 L 464.0,236.5 L 482.0,247.7 L 500.0,258.5 L 518.0,268.9 L 536.0,279.0 L 554.0,288.7 L 572.0,298.1 L 590.0,307.2 L 608.0,316.0 L 626.0,324.5 L 644.0,332.7 L 662.0,340.6 L 680.0,348.3 L 698.0,355.7 L 716.0,362.9 L 734.0,369.8 L 752.0,376.5 L 770.0,383.0 L 788.0,389.3 L 806.0,395.4 L 824.0,401.3 L 842.0,407.0 L 860.0,412.5"
        fill="none" stroke="#00897b" stroke-width="3" stroke-dasharray="9 5"/>
  <path d="M 320.0,30.0 L 338.0,48.0 L 356.0,65.5 L 374.0,82.2 L 392.0,98.5 L 410.0,114.1 L 428.0,129.2 L 446.0,143.8 L 464.0,157.8 L 482.0,171.4 L 500.0,184.6 L 518.0,197.2 L 536.0,209.5 L 554.0,221.3 L 572.0,232.7 L 590.0,243.8 L 608.0,254.5 L 626.0,264.8 L 644.0,274.8 L 662.0,284.4 L 680.0,293.7 L 698.0,302.7 L 716.0,311.5 L 734.0,319.9 L 752.0,328.0 L 770.0,335.9 L 788.0,343.6 L 806.0,351.0 L 824.0,358.1 L 842.0,365.0 L 860.0,371.8"
        fill="none" stroke="#f57c00" stroke-width="3" stroke-dasharray="9 5"/>
  <path d="M 392.0,30.0 L 410.0,47.8 L 428.0,64.9 L 446.0,81.5 L 464.0,97.5 L 482.0,112.9 L 500.0,127.8 L 518.0,142.2 L 536.0,156.1 L 554.0,169.6 L 572.0,182.6 L 590.0,195.1 L 608.0,207.2 L 626.0,219.0 L 644.0,230.3 L 662.0,241.2 L 680.0,251.8 L 698.0,262.1 L 716.0,272.0 L 734.0,281.6 L 752.0,290.8 L 770.0,299.8 L 788.0,308.5 L 806.0,316.9 L 824.0,325.0 L 842.0,332.9 L 860.0,340.5"
        fill="none" stroke="#c62828" stroke-width="3" stroke-dasharray="9 5"/>

  <!-- RH threshold reference lines (defaults: preferred 60 / maximum 65 / critical 75) -->
  <g stroke="#5f6368" stroke-width="1.5" stroke-dasharray="1 4" stroke-linecap="round">
   <line x1="140" y1="258.6" x2="860" y2="258.6"/>
   <line x1="140" y1="230.0" x2="860" y2="230.0"/>
   <line x1="140" y1="172.9" x2="860" y2="172.9"/>
  </g>
  <!-- RH threshold labels, inline just above each line, with a light halo for legibility -->
  <g font-family="Arial" font-size="11.5" fill="#374850" paint-order="stroke" stroke="#fff" stroke-width="3">
   <text x="146" y="254.6">Preferred 60%</text>
   <text x="146" y="226.0">Maximum 65%</text>
   <text x="146" y="168.9">Critical 75%</text>
  </g>

  <!-- example marker: Getting Started test-mode defaults, 18 degC / 55% RH -->
  <circle cx="428.0" cy="287.1" r="5.5" fill="#202124"/>
  <path d="M428.0,287.1 L500,287.1" stroke="#202124" stroke-width="1"/>
  <text x="506" y="282" font-family="Arial" font-size="12.5" fill="#202124">Test-mode defaults: 18°C / 55% RH</text>
  <text x="506" y="298" font-family="Arial" font-size="12.5" fill="#5f6368">→ dew point 8.8°C · spread 9.2°C · normal</text>

  <!-- axis ticks -->
  <g font-family="Arial" font-size="12.5" fill="#202124">
   <text x="140" y="450" text-anchor="middle">10</text>
   <text x="320" y="450" text-anchor="middle">15</text>
   <text x="500" y="450" text-anchor="middle">20</text>
   <text x="680" y="450" text-anchor="middle">25</text>
   <text x="860" y="450" text-anchor="middle">30</text>
   <text x="500" y="474" text-anchor="middle" font-size="13.5" font-weight="700">Room temperature (°C)</text>

   <text x="130" y="434" text-anchor="end">30</text>
   <text x="130" y="376.9" text-anchor="end">40</text>
   <text x="130" y="319.7" text-anchor="end">50</text>
   <text x="130" y="262.6" text-anchor="end">60</text>
   <text x="130" y="205.4" text-anchor="end">70</text>
   <text x="130" y="148.3" text-anchor="end">80</text>
   <text x="130" y="91.1" text-anchor="end">90</text>
   <text x="130" y="34" text-anchor="end">100</text>
  </g>
  <text font-family="Arial" font-size="13.5" font-weight="700" fill="#202124" transform="translate(45,230) rotate(-90)" text-anchor="middle">Relative humidity (%)</text>

  <!-- legend box, placed in the empty low-temperature / low-humidity corner -->
  <rect x="150" y="278" width="246" height="112" fill="#ffffff" opacity="0.92" stroke="#d6d6d6"/>
  <g font-family="Arial" font-size="12">
   <line x1="160" y1="298" x2="188" y2="298" stroke="#00897b" stroke-width="3" stroke-dasharray="6 3"/>
   <text x="194" y="302" fill="#202124">Dew point 12°C — preferred (fixed)</text>
   <line x1="160" y1="320" x2="188" y2="320" stroke="#f57c00" stroke-width="3" stroke-dasharray="6 3"/>
   <text x="194" y="324" fill="#202124">Dew point 15°C — high (fixed)</text>
   <line x1="160" y1="342" x2="188" y2="342" stroke="#c62828" stroke-width="3" stroke-dasharray="6 3"/>
   <text x="194" y="346" fill="#202124">Dew point 17°C — critical (fixed)</text>
   <line x1="160" y1="364" x2="188" y2="364" stroke="#8e24aa" stroke-width="2.25" stroke-dasharray="1 4"/>
   <text x="194" y="368" fill="#202124">Condensation risk, spread ≤3°C</text>
   <text x="194" y="382" fill="#5f6368" font-size="11">(safety-margin setting, adjustable)</text>
  </g>
 </g>

 <!-- footer notes -->
 <g font-family="Arial" font-size="12" fill="#5f6368">
  <text x="32" y="542">Dashed horizontal lines = Preferred / Maximum / Critical RH — adjustable in Setup → Configure (defaults shown: 60% / 65% / 75%).</text>
  <text x="32" y="560">Dashed diagonal lines = dew-point risk thresholds — fixed at 12°C / 15°C / 17°C in ZEAL-Dry 0.2.0, not yet an adjustable setting.</text>
 </g>
</svg>
